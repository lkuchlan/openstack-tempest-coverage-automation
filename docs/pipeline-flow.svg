<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1260" viewBox="0 0 1540 1260"
     style="background-color:#ffffff; background-image:radial-gradient(circle,#c8c8c8 1px,transparent 1px); background-size:22px 22px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#555"/>
    </marker>
    <marker id="arr-d" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#999"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2a7a2a"/>
    </marker>
    <marker id="arr-o" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#c07000"/>
    </marker>
  </defs>

  <text x="48" y="36" font-size="15" font-weight="400" fill="#555" letter-spacing="0.3">Tempest Coverage Pipeline — Full Flow</text>

  <!-- ROW 1: trigger → main pipeline -->
  <line x1="258" y1="80" x2="258" y2="112" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="320" y1="126" x2="406" y2="126" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="478" y1="126" x2="576" y2="126" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="672" y1="126" x2="796" y2="126" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="442" y="119" text-anchor="middle" font-size="10" fill="#999">jira-coverage-analysis</text>
  <text x="624" y="119" text-anchor="middle" font-size="10" fill="#999">post-test-plan</text>

  <!-- ROW 2: AWAITING_APPROVAL branches -->
  <polyline points="848,140 848,178 624,178 624,258" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <line x1="888" y1="140" x2="888" y2="258" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <polyline points="928,140 928,178 1158,178 1158,258" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <polyline points="965,140 965,178 1430,178 1430,258" stroke="#c07000" stroke-width="1.3" fill="none" marker-end="url(#arr-o)"/>
  <!-- NEEDS_DISCUSSION → back to AWAITING_APPROVAL loop (outside top) -->
  <polyline points="1430,290 1510,290 1510,108 900,108 900,120" stroke="#c07000" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-o)"/>
  <text x="1205" y="102" text-anchor="middle" font-size="10" fill="#c07000" font-style="italic">revised plan repost → re-enters AWAITING_APPROVAL</text>

  <!-- approval-monitor bracket -->
  <line x1="803" y1="150" x2="803" y2="196" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="1470" y1="150" x2="1470" y2="196" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="803" y1="196" x2="1470" y2="196" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="1136" y="208" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">approval-monitor agent — polls Jira every 4 h (durable cron)</text>

  <!-- ROW 3: APPROVED → IMPLEMENTING -->
  <line x1="624" y1="275" x2="624" y2="358" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="918" y1="378" x2="684" y2="378" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-d)"/>

  <!-- ROW 4: IMPLEMENTING → CODE_REVIEW -->
  <line x1="624" y1="395" x2="624" y2="458" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- CODE_REVIEW → FIX_IN_PROGRESS loop -->
  <line x1="572" y1="472" x2="434" y2="472" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <polyline points="348,460 348,436 572,436 572,460" stroke="#555" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <text x="460" y="430" text-anchor="middle" font-size="10" fill="#999">re-implement → re-review</text>
  <text x="503" y="465" text-anchor="middle" font-size="10" fill="#999">FAILED (retry)</text>

  <!-- CODE_REVIEW → CODE_REVIEW_FAILED -->
  <line x1="684" y1="472" x2="868" y2="472" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="776" y="465" text-anchor="middle" font-size="10" fill="#999">FAILED (max retries)</text>

  <!-- CODE_REVIEW → VERIFYING -->
  <line x1="624" y1="490" x2="624" y2="558" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="636" y="530" font-size="10" fill="#999">PASSED</text>

  <!-- ROW 5: VERIFYING → 5 branches -->
  <line x1="624" y1="578" x2="624" y2="618" stroke="#555" stroke-width="1.3"/>
  <line x1="80"  y1="618" x2="1138" y2="618" stroke="#555" stroke-width="1.3"/>
  <line x1="80"  y1="618" x2="80"  y2="702" stroke="#555" stroke-width="1.3" marker-end="url(#arr-g)"/>
  <line x1="290" y1="618" x2="290" y2="702" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="530" y1="618" x2="530" y2="702" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="790" y1="618" x2="790" y2="702" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="1138" y1="618" x2="1138" y2="702" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ROW 6: second-level outcomes -->
  <line x1="290" y1="722" x2="290" y2="806" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="530" y1="722" x2="530" y2="806" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="790" y1="722" x2="790" y2="806" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ROW 7: FIX_IN_PROGRESS → VERIFYING attempt 2 -->
  <line x1="290" y1="832" x2="290" y2="904" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ROW 8: final outcomes -->
  <line x1="290" y1="928" x2="290" y2="962" stroke="#555" stroke-width="1.3"/>
  <line x1="185" y1="962" x2="440" y2="962" stroke="#555" stroke-width="1.3"/>
  <line x1="185" y1="962" x2="185" y2="1034" stroke="#555" stroke-width="1.3" marker-end="url(#arr-g)"/>
  <line x1="440" y1="962" x2="440" y2="1034" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- git review convergence -->
  <polyline points="80,722 80,1140 126,1140" stroke="#2a7a2a" stroke-width="1.3" fill="none" marker-end="url(#arr-g)"/>
  <polyline points="185,1054 185,1140 116,1140" stroke="#2a7a2a" stroke-width="1.3" fill="none" marker-end="url(#arr-g)"/>

  <!-- NODE LABELS -->

  <text x="258" y="70"  text-anchor="middle" font-size="13" fill="#444">Cron / Manual trigger</text>
  <text x="258"  y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">DISCOVERED</text>
  <text x="442"  y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">ANALYZED</text>
  <text x="624"  y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">PLAN_POSTED</text>
  <text x="888"  y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">AWAITING_APPROVAL</text>

  <text x="624"  y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">APPROVED</text>
  <text x="888"  y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">REJECTED</text>
  <text x="1158" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">TIMED_OUT</text>
  <text x="1158" y="286" text-anchor="middle" font-size="11" fill="#999">(no approval response)</text>

  <text x="1430" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#c07000">NEEDS_DISCUSSION</text>
  <text x="1430" y="286" text-anchor="middle" font-size="11" fill="#999">(discussion_flagged)</text>
  <text x="1430" y="302" text-anchor="middle" font-size="10" fill="#999">stays AWAITING_APPROVAL</text>

  <text x="624" y="375" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">IMPLEMENTING</text>
  <text x="624" y="391" text-anchor="middle" font-size="10" fill="#999">implement-tempest-tests</text>
  <text x="924" y="371" text-anchor="start"  font-size="12" fill="#999" font-style="italic">(DEFERRED: VM locked, retry next run)</text>

  <text x="624" y="472" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">CODE_REVIEW</text>
  <text x="624" y="487" text-anchor="middle" font-size="10" fill="#999">code-reviewer agent</text>

  <text x="348" y="468" text-anchor="middle" font-size="12" font-weight="500" fill="#c07000">FIX_IN_PROGRESS</text>
  <text x="348" y="482" text-anchor="middle" font-size="10" fill="#999">(source: code_review)</text>

  <text x="958" y="468" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">CODE_REVIEW_FAILED</text>

  <text x="624" y="570" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">VERIFYING</text>
  <text x="624" y="585" text-anchor="middle" font-size="10" fill="#999">verify-tempest-devstack</text>

  <text x="80"   y="717" text-anchor="middle" font-size="13" font-weight="600" fill="#2a7a2a">VERIFIED</text>
  <text x="290"  y="717" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">FAILED</text>
  <text x="530"  y="717" text-anchor="middle" font-size="13" font-weight="600" fill="#888">SKIPPED</text>
  <text x="790"  y="717" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">DEPLOYMENT_FAILED</text>
  <text x="1138" y="717" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">ERROR</text>
  <text x="1138" y="733" text-anchor="middle" font-size="11" fill="#999">(crash / SSH fail)</text>

  <text x="290" y="820" text-anchor="middle" font-size="12" font-weight="500" fill="#c07000">FIX_IN_PROGRESS</text>
  <text x="290" y="834" text-anchor="middle" font-size="10" fill="#999">(source: devstack)</text>
  <text x="530" y="820" text-anchor="middle" font-size="12" font-weight="600" fill="#888">VERIFICATION_SKIPPED</text>
  <text x="530" y="834" text-anchor="middle" font-size="11" fill="#999">(environment not feasible)</text>
  <text x="790" y="820" text-anchor="middle" font-size="12" font-weight="600" fill="#b03030">ERROR</text>
  <text x="790" y="834" text-anchor="middle" font-size="11" fill="#999">(no retry — infra issue)</text>

  <text x="290" y="918" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">VERIFYING</text>
  <text x="290" y="934" text-anchor="middle" font-size="11" fill="#999">(attempt 2, --skip-deploy)</text>

  <text x="185" y="1048" text-anchor="middle" font-size="13" font-weight="600" fill="#2a7a2a">VERIFIED</text>
  <text x="440" y="1048" text-anchor="middle" font-size="13" font-weight="600" fill="#b03030">VERIFICATION_FAILED</text>

  <text x="162" y="1150" text-anchor="middle" font-size="13" fill="#333">git review (manual)</text>

  <!-- LEGEND -->
  <rect x="1048" y="950" width="270" height="172" rx="4" fill="white" fill-opacity="0.88" stroke="#ddd" stroke-width="1"/>
  <text x="1063" y="972" font-size="11" font-weight="600" fill="#555">Legend</text>
  <line x1="1063" y1="990" x2="1098" y2="990" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="1106" y="994" font-size="11" fill="#555">Stage transition (skill)</text>
  <line x1="1063" y1="1012" x2="1098" y2="1012" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-d)"/>
  <text x="1106" y="1016" font-size="11" fill="#555">Deferred / retry</text>
  <line x1="1063" y1="1034" x2="1098" y2="1034" stroke="#2a7a2a" stroke-width="1.3" marker-end="url(#arr-g)"/>
  <text x="1106" y="1038" font-size="11" fill="#555">Success path</text>
  <circle cx="1068" cy="1057" r="5" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="1080" y="1061" font-size="11" fill="#1a1a1a">Pipeline stage</text>
  <circle cx="1068" cy="1079" r="5" fill="none" stroke="#b03030" stroke-width="1"/>
  <text x="1080" y="1083" font-size="11" fill="#b03030">Terminal (failure)</text>
  <circle cx="1068" cy="1101" r="5" fill="none" stroke="#c07000" stroke-width="1"/>
  <text x="1080" y="1105" font-size="11" fill="#c07000">Retry / fix cycle</text>

</svg>
